################################################################
# CorteX -- Docker Compose (multi-platform)
#
# Usage:
#   macOS / CPU-only:   docker compose up -d
#   NVIDIA GPU:         docker compose --profile nvidia up -d
#
# On macOS (Apple Silicon / Intel):
#   - Ollama runs NATIVELY (not in Docker) for Metal GPU access
#   - Only postgres + redis run in containers
#   - Install Ollama: brew install ollama && ollama serve
#
# On Linux with NVIDIA GPU:
#   - All services run in Docker
#   - Requires: nvidia-container-toolkit
#   - Use: docker compose --profile nvidia up -d
#
# On Linux CPU-only:
#   - docker compose up -d (Ollama without GPU acceleration)
################################################################

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex_dev}
      POSTGRES_DB: cortex
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  #-----------------------------------------------------------------
  # Ollama -- CPU-only (Linux without GPU)
  # On macOS, skip this and run Ollama natively for Metal GPU access
  #-----------------------------------------------------------------
  ollama:
    image: ollama/ollama
    profiles: ["linux"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "4"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  #-----------------------------------------------------------------
  # Ollama -- NVIDIA GPU (Linux with nvidia-container-toolkit)
  #-----------------------------------------------------------------
  ollama-nvidia:
    image: ollama/ollama
    profiles: ["nvidia"]
    runtime: nvidia
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_GPU: "99"
      OLLAMA_GPU_OVERHEAD: "0"
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_NUM_PARALLEL: "4"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  #-----------------------------------------------------------------
  # Ingestion Workers (Node.js + graphify Python bridge)
  #-----------------------------------------------------------------
  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${HOME}/.ssh:/home/cortex/.ssh:ro
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://cortex:${POSTGRES_PASSWORD:-cortex_dev}@postgres:5432/cortex
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ollama_data:
